{% extends "base.html" %}

{% block content %}
<section class="error-page" aria-labelledby="server-error-title">
    <div class="container error-layout">
        <div>
            <p class="error-code">500</p>
            <p class="eyebrow">Что-то пошло не так</p>
            <h1 id="server-error-title">Эта страница временно недоступна</h1>
            <p>Мы уже можем увидеть ошибку в журнале сервера. Попробуйте вернуться к расписанию или открыть главную страницу.</p>
            <div class="hero-actions">
                <a class="button primary" href="{{ url_for('competitions') }}">К конкурсам <span aria-hidden="true">→</span></a>
                <a class="button button-quiet" href="{{ url_for('index') }}">На главную</a>
            </div>
        </div>
        <div class="error-logo" aria-hidden="true"><img src="{{ url_for('static', path='/images/artflow-logo.png') }}" alt=""></div>
    </div>
</section>
{% endblock %}
