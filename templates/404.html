{% extends "base.html" %}

{% block content %}
<section class="error-page" aria-labelledby="not-found-title">
    <div class="container error-layout">
        <div>
            <p class="error-code">404</p>
            <p class="eyebrow">Страница не найдена</p>
            <h1 id="not-found-title">Похоже, здесь уже закончилась программа</h1>
            <p>Такого конкурса или раздела нет. Вернитесь к расписанию и выберите доступное событие.</p>
            <div class="hero-actions">
                <a class="button primary" href="{{ url_for('competitions') }}">К конкурсам <span aria-hidden="true">→</span></a>
                <a class="button button-quiet" href="{{ url_for('index') }}">На главную</a>
            </div>
        </div>
        <div class="error-logo" aria-hidden="true"><img src="{{ url_for('static', path='/images/artflow-logo-512.png') }}" alt="" width="512" height="512"></div>
    </div>
</section>
{% endblock %}
